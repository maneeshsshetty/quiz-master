{% extends 'quiz_master/base.html' %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <h2>Set Your Password</h2>
        <p style="margin-bottom: 1.5rem; color: var(--text-muted);">Please set a secure password to activate your
            account.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" name="password" id="password" required placeholder="Enter new password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Set Password & Login</button>
        </form>
    </div>
</div>
{% endblock %}
