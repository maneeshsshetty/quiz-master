{% extends 'quiz_master/base.html' %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <h2>Create New User</h2>
        <p style="margin-bottom: 1.5rem; color: var(--text-muted);">Enter the email address to send an invitation.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" required placeholder="user@example.com">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Send Invitation</button>
        </form>
    </div>
</div>
{% endblock %}
